name: Release

# Push a tag like v0.1.0 (or run manually) to build installers for
# Windows, macOS (Apple Silicon + Intel) and Linux and attach them to a draft release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system packages
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundles; the app checks updates against the matching public key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "ApexSites.club Track Builder v__VERSION__"
          releaseBody: "New features and fixes. Full notes and installers for every system are on the release page."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Same installers under fixed names, so the README can link to
      # releases/latest/download/<name> and never go stale.
      - name: Upload installers with simple names
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id='${{ steps.tauri.outputs.releaseId }}'
          up() { gh api --method POST -H "Content-Type: application/octet-stream" "https://uploads.github.com/repos/${{ github.repository }}/releases/$id/assets?name=$2" --input "$1" > /dev/null && echo "uploaded $2"; }
          # Find the installers on disk (artifactPaths isn't valid JSON on Windows: unescaped backslashes).
          find src-tauri/target -path '*/bundle/*' \( -name '*-setup.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) -type f | while IFS= read -r f; do
            case "$f" in
              *-setup.exe) up "$f" TrackBuilder-Windows-Setup.exe ;;
              *_aarch64.dmg) up "$f" TrackBuilder-Mac-AppleSilicon.dmg ;;
              *_x64.dmg) up "$f" TrackBuilder-Mac-Intel.dmg ;;
              *.AppImage) up "$f" TrackBuilder-Linux.AppImage ;;
              *.deb) up "$f" TrackBuilder-Linux.deb ;;
            esac
          done
